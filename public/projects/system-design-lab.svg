<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="sdl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111B30"/>
      <stop offset="1" stop-color="#16223d"/>
    </linearGradient>
    <linearGradient id="sdl-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2660D"/>
      <stop offset="1" stop-color="#FFA94D"/>
    </linearGradient>
    <filter id="sdl-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sdl-bg)"/>

  <!-- faint grid dots, instrument-panel texture -->
  <g fill="#2a3a5c" opacity="0.5">
    <circle cx="80" cy="80" r="2.5"/><circle cx="140" cy="80" r="2.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="1080" cy="640" r="2.5"/><circle cx="1140" cy="640" r="2.5"/><circle cx="1200" cy="640" r="2.5"/>
    <circle cx="1160" cy="90" r="2.5"/><circle cx="1200" cy="130" r="2.5"/>
    <circle cx="100" cy="620" r="2.5"/><circle cx="140" cy="660" r="2.5"/>
  </g>

  <!-- title -->
  <text x="640" y="128" text-anchor="middle" font-size="30" letter-spacing="6" fill="#FFA94D" font-weight="700">SYSTEM DESIGN LAB</text>
  <text x="640" y="180" text-anchor="middle" font-size="46" fill="#E7ECF7" font-weight="800">Learning system design, one day at a time</text>

  <!-- mock hub card -->
  <g filter="url(#sdl-soft)">
    <rect x="220" y="240" width="840" height="320" rx="18" fill="#121B2E" stroke="#243252" stroke-width="2"/>
  </g>

  <!-- day row 1 -->
  <text x="264" y="308" font-size="34" font-family="Consolas, monospace" font-weight="700" fill="#5E6B8C">01</text>
  <rect x="330" y="278" width="90" height="26" rx="13" fill="rgba(74,222,128,0.14)"/>
  <text x="345" y="296" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#4ADE80">TOOL LIVE</text>
  <text x="330" y="330" font-size="24" fill="#E7ECF7" font-weight="700">Foundations</text>
  <rect x="900" y="284" width="120" height="34" rx="8" fill="url(#sdl-accent)"/>
  <text x="960" y="307" text-anchor="middle" font-size="16" fill="#0B1220" font-weight="700">Open tool</text>

  <line x1="264" y1="352" x2="1020" y2="352" stroke="#243252" stroke-width="1"/>

  <!-- day row 2 -->
  <text x="264" y="398" font-size="34" font-family="Consolas, monospace" font-weight="700" fill="#5E6B8C">03</text>
  <rect x="330" y="368" width="90" height="26" rx="13" fill="rgba(74,222,128,0.14)"/>
  <text x="345" y="386" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#4ADE80">TOOL LIVE</text>
  <text x="330" y="420" font-size="24" fill="#E7ECF7" font-weight="700">Load Balancers &amp; Scaling</text>
  <rect x="900" y="374" width="120" height="34" rx="8" fill="url(#sdl-accent)"/>
  <text x="960" y="397" text-anchor="middle" font-size="16" fill="#0B1220" font-weight="700">Open tool</text>

  <line x1="264" y1="442" x2="1020" y2="442" stroke="#243252" stroke-width="1"/>

  <!-- day row 3 -->
  <text x="264" y="488" font-size="34" font-family="Consolas, monospace" font-weight="700" fill="#5E6B8C">06</text>
  <rect x="330" y="458" width="90" height="26" rx="13" fill="rgba(74,222,128,0.14)"/>
  <text x="345" y="476" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#4ADE80">TOOL LIVE</text>
  <text x="330" y="510" font-size="24" fill="#E7ECF7" font-weight="700">Caching</text>
  <rect x="900" y="464" width="120" height="34" rx="8" fill="url(#sdl-accent)"/>
  <text x="960" y="487" text-anchor="middle" font-size="16" fill="#0B1220" font-weight="700">Open tool</text>

  <!-- tags -->
  <g font-size="24" font-weight="600">
    <rect x="360" y="612" width="150" height="46" rx="23" fill="url(#sdl-accent)"/>
    <text x="435" y="643" text-anchor="middle" fill="#0B1220">JavaScript</text>
    <rect x="526" y="612" width="190" height="46" rx="23" fill="#243252"/>
    <text x="621" y="643" text-anchor="middle" fill="#E7ECF7">System Design</text>
    <rect x="732" y="612" width="130" height="46" rx="23" fill="#243252"/>
    <text x="797" y="643" text-anchor="middle" fill="#E7ECF7">Vercel</text>
  </g>
</svg>
