<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111B30"/>
      <stop offset="1" stop-color="#16223d"/>
    </linearGradient>
    <linearGradient id="ic-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F04438"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ic-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ic-bg)"/>

  <!-- faint grid dots -->
  <g fill="#2a3a5c" opacity="0.5">
    <circle cx="80" cy="80" r="2.5"/><circle cx="140" cy="80" r="2.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="1080" cy="640" r="2.5"/><circle cx="1140" cy="640" r="2.5"/><circle cx="1200" cy="640" r="2.5"/>
    <circle cx="1160" cy="90" r="2.5"/><circle cx="1200" cy="130" r="2.5"/>
    <circle cx="100" cy="620" r="2.5"/><circle cx="140" cy="660" r="2.5"/>
  </g>

  <!-- title -->
  <text x="640" y="118" text-anchor="middle" font-size="30" letter-spacing="6" fill="#FFA94D" font-weight="700">INCIDENT COPILOT</text>
  <text x="640" y="172" text-anchor="middle" font-size="44" fill="#E7ECF7" font-weight="800">An AI agent that triages your incidents</text>
  <text x="640" y="212" text-anchor="middle" font-size="22" fill="#8B93A7">Java Spring Boot API  ·  Python LangGraph agent  ·  Gemini</text>

  <!-- service card (left) -->
  <g filter="url(#ic-soft)">
    <rect x="130" y="270" width="420" height="300" rx="18" fill="#121B2E" stroke="#243252" stroke-width="2"/>
  </g>
  <text x="162" y="318" font-size="15" letter-spacing="3" fill="#5E6B8C" font-weight="700">SERVICE</text>
  <text x="162" y="360" font-size="30" fill="#E7ECF7" font-weight="800">payments-svc</text>
  <rect x="162" y="378" width="118" height="30" rx="15" fill="rgba(240,68,56,0.16)"/>
  <text x="178" y="399" font-size="15" font-family="Consolas, monospace" font-weight="700" fill="#F87171">DEGRADED</text>
  <text x="162" y="452" font-size="19" font-family="Consolas, monospace" fill="#C7D0E3">NullPointerException  ×52</text>
  <text x="162" y="486" font-size="19" font-family="Consolas, monospace" fill="#C7D0E3">p99 latency   1114 ms</text>
  <text x="162" y="520" font-size="19" font-family="Consolas, monospace" fill="#C7D0E3">deploy        v1.9.4</text>

  <!-- arrow / agent -->
  <g>
    <text x="640" y="400" text-anchor="middle" font-size="15" letter-spacing="2" fill="#8B93A7" font-weight="700">AGENT INVESTIGATES</text>
    <line x1="565" y1="430" x2="705" y2="430" stroke="url(#ic-accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M705 430 l-16 -9 l0 18 z" fill="#F59E0B"/>
    <g font-size="13" font-family="Consolas, monospace" fill="#5E6B8C" text-anchor="middle">
      <text x="640" y="462">status → errors →</text>
      <text x="640" y="482">latency → summarize</text>
    </g>
  </g>

  <!-- incident card (right) -->
  <g filter="url(#ic-soft)">
    <rect x="730" y="270" width="420" height="300" rx="18" fill="#121B2E" stroke="#243252" stroke-width="2"/>
  </g>
  <text x="762" y="318" font-size="15" letter-spacing="3" fill="#5E6B8C" font-weight="700">INCIDENT CREATED</text>
  <text x="762" y="360" font-size="30" fill="#E7ECF7" font-weight="800">INC-0001</text>
  <rect x="762" y="378" width="80" height="30" rx="15" fill="rgba(245,158,11,0.18)"/>
  <text x="778" y="399" font-size="15" font-family="Consolas, monospace" font-weight="700" fill="#FBBF24">SEV2</text>
  <text x="762" y="452" font-size="18" fill="#C7D0E3">Root cause: bad deploy v1.9.4</text>
  <text x="762" y="482" font-size="18" fill="#C7D0E3">introduced an NPE in refunds.</text>
  <text x="762" y="524" font-size="18" fill="#93E6B4" font-weight="700">Next step: roll back to v1.9.3</text>

  <!-- tool chips -->
  <g font-size="15" font-family="Consolas, monospace" font-weight="700">
    <rect x="300" y="620" width="150" height="38" rx="19" fill="#141E33" stroke="#2A3A5C"/>
    <text x="375" y="645" text-anchor="middle" fill="#9FB0D0">get_status</text>
    <rect x="466" y="620" width="150" height="38" rx="19" fill="#141E33" stroke="#2A3A5C"/>
    <text x="541" y="645" text-anchor="middle" fill="#9FB0D0">get_errors</text>
    <rect x="632" y="620" width="160" height="38" rx="19" fill="#141E33" stroke="#2A3A5C"/>
    <text x="712" y="645" text-anchor="middle" fill="#9FB0D0">get_latency</text>
    <rect x="808" y="620" width="180" height="38" rx="19" fill="rgba(245,158,11,0.14)" stroke="#7A5514"/>
    <text x="898" y="645" text-anchor="middle" fill="#FBBF24">create_incident</text>
  </g>
</svg>
