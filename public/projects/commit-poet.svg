<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f6"/>
      <stop offset="0.5" stop-color="#ffe3ec"/>
      <stop offset="1" stop-color="#ffd0e4"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff5c8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- floating accents -->
  <text x="120" y="140" font-size="52" opacity="0.5">🎀</text>
  <text x="1120" y="180" font-size="48" opacity="0.5">💕</text>
  <text x="1080" y="600" font-size="44" opacity="0.45">🌸</text>
  <text x="180" y="600" font-size="40" opacity="0.4">✨</text>

  <!-- title -->
  <text x="640" y="150" text-anchor="middle" font-size="68" font-weight="800" fill="#d6336c">🎋 Commit Message Poet</text>
  <text x="640" y="205" text-anchor="middle" font-size="30" fill="#c2255c" font-weight="600">turn your git diff into poetry</text>

  <!-- output card -->
  <g filter="url(#soft)">
    <rect x="240" y="260" width="800" height="300" rx="24" fill="#ffffff"/>
  </g>
  <text x="290" y="330" font-size="30" fill="#d6336c" font-weight="700" font-style="italic">Session, if it's null,</text>
  <text x="290" y="378" font-size="30" fill="#d6336c" font-weight="700" font-style="italic">gives you a four-oh-one,</text>
  <text x="290" y="426" font-size="30" fill="#d6336c" font-weight="700" font-style="italic">before access fails.</text>
  <rect x="290" y="470" width="700" height="2" fill="#ffd0e4"/>
  <text x="290" y="518" font-size="26" fill="#495057" font-family="'Consolas', monospace">fix(login): return 401 when session is missing</text>

  <!-- tags -->
  <g font-size="24" font-weight="600">
    <rect x="360" y="612" width="120" height="46" rx="23" fill="url(#btn)"/>
    <text x="420" y="643" text-anchor="middle" fill="#ffffff">Python</text>
    <rect x="496" y="612" width="120" height="46" rx="23" fill="#ff7aa2"/>
    <text x="556" y="643" text-anchor="middle" fill="#ffffff">Gradio</text>
    <rect x="632" y="612" width="130" height="46" rx="23" fill="#ff7aa2"/>
    <text x="697" y="643" text-anchor="middle" fill="#ffffff">Gemini</text>
    <rect x="778" y="612" width="90" height="46" rx="23" fill="#ff7aa2"/>
    <text x="823" y="643" text-anchor="middle" fill="#ffffff">LLM</text>
  </g>
</svg>
