<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f16"/>
      <stop offset="0.55" stop-color="#1b1320"/>
      <stop offset="1" stop-color="#241826"/>
    </linearGradient>
    <linearGradient id="cp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <filter id="cp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#cp-bg)"/>

  <!-- faint dots, matching the dark cover texture -->
  <g fill="#4a2f3f" opacity="0.5">
    <circle cx="80" cy="80" r="2.5"/><circle cx="140" cy="80" r="2.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="1080" cy="640" r="2.5"/><circle cx="1140" cy="640" r="2.5"/><circle cx="1200" cy="640" r="2.5"/>
    <circle cx="1160" cy="90" r="2.5"/><circle cx="1200" cy="130" r="2.5"/>
    <circle cx="100" cy="620" r="2.5"/><circle cx="140" cy="660" r="2.5"/>
  </g>

  <!-- title -->
  <text x="640" y="128" text-anchor="middle" font-size="30" letter-spacing="6" fill="#ff8fb1" font-weight="700">GIT DIFF → POETRY</text>
  <text x="640" y="180" text-anchor="middle" font-size="46" fill="#F5EAF0" font-weight="800">🎋 Commit Message Poet</text>

  <!-- output card -->
  <g filter="url(#cp-soft)">
    <rect x="220" y="240" width="840" height="320" rx="18" fill="#1b141f" stroke="#3a2a34" stroke-width="2"/>
  </g>

  <!-- haiku -->
  <text x="264" y="312" font-size="30" font-style="italic" font-weight="700" fill="#ff8fb1">Session gone astray,</text>
  <text x="264" y="360" font-size="30" font-style="italic" font-weight="700" fill="#ff8fb1">Forty-one is your new friend,</text>
  <text x="264" y="408" font-size="30" font-style="italic" font-weight="700" fill="#ff8fb1">No more null access.</text>

  <line x1="264" y1="452" x2="1016" y2="452" stroke="#3a2a34" stroke-width="1"/>

  <!-- conventional commit line -->
  <text x="264" y="508" font-size="24" font-family="Consolas, monospace" fill="#c9b3bf">fix(auth): return 401 when session is missing</text>

  <!-- tags -->
  <g font-size="24" font-weight="600">
    <rect x="360" y="612" width="120" height="46" rx="23" fill="url(#cp-accent)"/>
    <text x="420" y="643" text-anchor="middle" fill="#140f16">Python</text>
    <rect x="496" y="612" width="120" height="46" rx="23" fill="#3a2a34"/>
    <text x="556" y="643" text-anchor="middle" fill="#F5EAF0">Gradio</text>
    <rect x="632" y="612" width="130" height="46" rx="23" fill="#3a2a34"/>
    <text x="697" y="643" text-anchor="middle" fill="#F5EAF0">Gemini</text>
    <rect x="778" y="612" width="90" height="46" rx="23" fill="#3a2a34"/>
    <text x="823" y="643" text-anchor="middle" fill="#F5EAF0">LLM</text>
  </g>
</svg>
